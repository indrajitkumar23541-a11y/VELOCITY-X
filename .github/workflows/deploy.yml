name: Deploy VELOCITY X & Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # JOB 1: Build Web App & Deploy to GitHub Pages (For iOS & Android 1-Tap Standalone Install)
  deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # JOB 2: Build Native Android APK in Cloud (100% Offline Standalone Game)
  build-android-apk:
    runs-on: ubuntu-latest
    needs: deploy-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install
          npm run build
          cp -r dist/* android/app/src/main/assets/public/

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./VELOCITY-X.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELOCITY-X-Android-APK
          path: ./VELOCITY-X.apk

      - name: Create or Update GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          name: "VELOCITY X — Official Universal Release (Android, Windows, iOS & Web)"
          body: |
            ## 🏎️ VELOCITY X — Cyber Highway Police Pursuit

            ### 📱 Download & Play on Every Device:
            - **Android (Phones & Tablets)**: Download `VELOCITY-X.apk` below and install directly!
            - **Windows (Laptops & PC)**: Download `VELOCITY-X-Setup.exe` below for full 4K 120 FPS desktop play!
            - **iOS / iPad / Android Web**: Open the live game link: [https://${{ github.repository_owner }}.github.io/VELOCITY-X/](https://${{ github.repository_owner }}.github.io/VELOCITY-X/) and tap **"Install App"** / **"Add to Home Screen"** to play 100% offline in Flight Mode!
          files: |
            ./VELOCITY-X.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JOB 3: Build Native Windows Setup .EXE (Windows Laptop & PC Game)
  build-windows-exe:
    runs-on: windows-latest
    needs: deploy-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Windows Executable Installer
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and Prepare Windows Setup File
        shell: pwsh
        run: |
          $setupFile = Get-ChildItem -Path release -Filter "*Setup*.exe" | Select-Object -First 1
          if ($setupFile) {
            Copy-Item $setupFile.FullName -Destination "./VELOCITY-X-Setup.exe"
            Write-Host "Prepared Windows Setup: ./VELOCITY-X-Setup.exe"
          } else {
            $anyExe = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
            if ($anyExe) {
              Copy-Item $anyExe.FullName -Destination "./VELOCITY-X-Setup.exe"
            }
          }

      - name: Upload Windows Setup as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELOCITY-X-Windows-Setup-EXE
          path: ./VELOCITY-X-Setup.exe

      - name: Attach Windows Setup to GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          files: |
            ./VELOCITY-X-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


